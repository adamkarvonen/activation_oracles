[project]
name = "nl_probes"
version = "0.0.1"
description = "nl_probes"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "accelerate==1.15.0",
    "codetiming",
    "datasets==3.6.0",
    "dill",
    "hydra-core",
    "liger-kernel",
    "numpy<2.0.0",
    "pandas",
    "peft==0.21.0",
    "pyarrow>=19.0.0",
    "fastparquet",
    "pybind11",
    "pylatexenc",
    "pre-commit",
    "ray[default]",
    "tensordict>=0.8.0,<=0.9.1,!=0.9.0",
    # torch 2.12 bundles Triton 3.7.1. Triton 3.4-3.7.0 gives wrong gated DeltaNet backward results on Hopper (fla #640)
    "torch==2.12.1",
    "flash-attn",
    # Fast Gated DeltaNet kernels for Qwen3.5 / Qwen3.6 linear attention layers
    "flash-linear-attention==0.5.2",
    "causal-conv1d==1.7.0",
    "torchdata",
    "transformers==5.17.0",
    "einops==0.8.1",
    "wandb==0.21.1",
    "packaging>=20.0",
    "uvicorn",
    "fastapi",
    "typer",
    "latex2sympy2_extended",
    "math_verify",
    "pydantic==2.11.7",
    "regex",
    "python-dotenv",  # Note: the package is "python-dotenv" not "dotenv"
    "slist",
    "plotly",
    "anthropic",
    "openai",
    "tenacity",
    "matplotlib",
    "trl==0.29.0",
    "bitsandbytes==0.48.1",
    "fire",
    "tqdm",
    "pytest",
    "ipykernel",
    "circuitsvis>=1.43.3",
    "jaxtyping",
    "huggingface-hub",
    "rapidfuzz",
    "hf_transfer",
]

[project.optional-dependencies]
# Only used by some experiment scripts (personaqa knowledge evals, patchscopes). Install in a separate env if needed;
# vllm pins its own torch/transformers versions.
vllm = ["vllm"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nl_probes", "nl_probes.*"]


[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]
causal-conv1d = [{ requirement = "torch", match-runtime = true }]
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
